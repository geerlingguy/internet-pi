---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "3 2 * * 0"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-core ansible-lint

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint

  syntax-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible and required collections.
        run: |
          pip3 install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Create throwaway inventory.
        run: |
          cat > inventory.ini <<'EOF'
          [internet_pi]
          127.0.0.1 ansible_connection=local ansible_user=pi
          EOF

      - name: Syntax check playbook.
        run: ansible-playbook --syntax-check main.yml
